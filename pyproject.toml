[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isac-world-model"
version = "0.3.0"
description = "From-scratch asynchronous visual-radio world-model research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0", "ruff==0.14.3", "build==1.3.0", "PyYAML==6.0.3"]

[project.scripts]
isac-wm = "isac_wm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["isac_wm"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# Syntax, undefined names, invalid control flow and malformed comparisons.
select = ["E9", "F63", "F7", "F82"]
