[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isac-world-model"
version = "0.2.0"
description = "From-scratch asynchronous visual-radio world-model research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
isac-wm = "isac_wm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
