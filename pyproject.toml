[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name = "isac-world-model"
version = "0.4.0"
description = "From-scratch asynchronous visual-radio world-model research prototype"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==2.5.4", "torch==2.14.1"]
[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "coverage==7.17.0", "ruff==0.17.2", "build==1.6.1", "PyYAML==6.0.3", "setuptools==84.2.1", "wheel==0.48.0", "pip==26.2.2", "uv==0.13.5", "packaging==26.3", "pyproject-hooks==1.3.3", "pip-audit==2.10.1"]
audit = ["pip-audit==2.10.1"]
browser = ["playwright==1.64.1"]
[project.scripts]
isac-wm = "isac_wm.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.coverage.run]
branch = true
source = ["isac_wm"]
[tool.coverage.report]
show_missing = true
skip_covered = true
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.uv]
required-version = "==0.13.5"
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
