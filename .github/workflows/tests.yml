name: required-ci
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: python-${{ matrix.os }}-${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-14
            python: '3.12'
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-24
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ci/constraints.txt
      - name: Install CPU torch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install torch on macOS (tests intentionally run on CPU)
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.10.0
      - run: python -m pip install -c ci/constraints.txt -e '.[dev]'
      - run: python scripts/ci.py --profile python --out validation/local-ci
      - name: Verify installation outside source tree
        run: python scripts/test_wheel.py --dist validation/local-ci/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: validation/local-ci/
          if-no-files-found: error
          retention-days: 14
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - run: python scripts/ci.py --profile native --out validation/native-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-linux
          path: validation/native-ci/
          if-no-files-found: error
          retention-days: 14
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.14.3 PyYAML==6.0.3
      - run: python scripts/check_contracts.py
      - run: python scripts/ci.py --profile quality --out validation/quality-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality
          path: validation/quality-ci/
          if-no-files-found: error
          retention-days: 14
  ci-gate:
    if: always()
    needs: [python, native, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Fail unless every required job succeeded
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['JOB_RESULTS'])
          failures = {name: result['result'] for name, result in jobs.items()
                      if result['result'] != 'success'}
          print(json.dumps(jobs, indent=2))
          if failures:
              raise SystemExit(f'Required checks did not pass: {failures}')
          PY
