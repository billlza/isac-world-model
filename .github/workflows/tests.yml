name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12.15'}
          - {os: ubuntu-latest, python: '3.13.17'}
          - {os: ubuntu-latest, python: '3.14.9'}
          - {os: macos-latest, python: '3.14.9'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: '0.13.5', enable-cache: true}
      - name: Install locked runtime
        run: |
          uv python install '${{ matrix.python }}'
          uv sync --locked --extra dev --python '${{ matrix.python }}'
      - name: Required Python CI
        run: .venv/bin/python scripts/ci.py --profile python --out validation/python
      - name: Show Python test failures
        if: failure()
        run: |
          if test -f validation/python/python-tests.log; then tail -n 160 validation/python/python-tests.log; fi
      - name: Paired verification planning evidence
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14.9'
        run: .venv/bin/python scripts/verification_study.py --out validation/verification-planning
      - name: Exercise both seed factors on separate CPU development splits
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14.9' && (github.head_ref == 'research/memory-evidence-seeds' || github.ref == 'refs/heads/research/memory-evidence-seeds')
        run: |
          export PYTHONPATH="$PWD/src"
          .venv/bin/python scripts/crossed_seed_study.py --out validation/memory-development --device cpu --profile smoke
          .venv/bin/python - <<'PYTHON'
          import json
          from pathlib import Path
          r = json.loads(Path("validation/memory-development/crossed.json").read_text())
          assert r["status"] == "completed" and len(r["cells"]) == 4
          print("CROSSED_SMOKE", json.dumps(r["results"]["development_B"]["maneuver"]["methods"]))
          PYTHON
      - name: Exercise capacity and data controls with real A96 and A512 training
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14.9' && (github.head_ref == 'research/capacity-data-h200' || github.ref == 'refs/heads/research/capacity-data-h200')
        run: |
          export PYTHONPATH="$PWD/src"
          .venv/bin/python scripts/capacity_data_study.py --out validation/capacity-development --device cpu --profile smoke
          .venv/bin/python - <<'PYTHON'
          import json
          from pathlib import Path
          r = json.loads(Path("validation/capacity-development/study.json").read_text())
          assert r["status"] == "completed" and len(r["cells"]) == 8
          assert all(c["optimizer_updates"] == 8 and c["validation_updates"] == [2, 4, 6, 8] for c in r["cells"].values())
          assert {c["parameters"] for c in r["cells"].values()} == {172246, 3883798}
          print("CAPACITY_SMOKE", json.dumps(r["results"]["development"]["maneuver"]["methods"]))
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            validation/python
            validation/verification-planning
            validation/memory-development/*.json
            validation/capacity-development/**/*.json
          if-no-files-found: error
          retention-days: 14
  vision-development:
    name: Visual learning / Hamilton PyTorch 2.9 CPU compatibility
    if: github.head_ref == 'research/vision-supervision-h200' || github.ref == 'refs/heads/research/vision-supervision-h200'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: '0.13.5', enable-cache: true}
      - name: Install matching Python and PyTorch versions on the CPU runner
        run: |
          uv python install 3.13.9
          uv venv --python 3.13.9 .vision-runtime
          uv pip install --python .vision-runtime/bin/python --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.0+cpu'
          uv pip install --python .vision-runtime/bin/python numpy==2.3.4
          .vision-runtime/bin/python - <<'PYTHON'
          import sys
          import numpy
          import torch
          assert sys.version_info[:3] == (3, 13, 9)
          assert torch.__version__ == '2.9.0+cpu'
          assert numpy.__version__ == '2.3.4'
          print('CPU compatibility check; CUDA behavior remains a Hamilton check.')
          PYTHON
      - name: Verify capture labels, gradients, passive diagnostics, and launch contracts
        run: |
          export PYTHONPATH="$PWD/src"
          .vision-runtime/bin/python -m unittest discover -s tests -p 'test_visual*.py' -v
          .vision-runtime/bin/python -m unittest discover -s tests -p 'test_vision_learning*.py' -v
          .vision-runtime/bin/python -m unittest discover -s tests -p 'test_training_runtime_profile.py' -v
      - name: Train all eight controlled development cells
        run: |
          export PYTHONPATH="$PWD/src"
          .vision-runtime/bin/python scripts/vision_learning_study.py --out validation/vision-development --device cpu --profile smoke
          .vision-runtime/bin/python - <<'PYTHON'
          import json
          from pathlib import Path
          r = json.loads(Path('validation/vision-development/study.json').read_text())
          assert r['status'] == 'completed' and len(r['cells']) == 8
          assert r['fresh_test_consumed'] is False and r['test_episode_seeds'] == []
          assert r['design']['optimizer_updates'] == 8
          assert {c['parameters'] for c in r['cells'].values()} == {3883798}
          assert {c['visual_encoder_parameters'] for c in r['cells'].values()} == {1230}
          print('VISION_SMOKE', json.dumps(r['summary']['contrasts']))
          PYTHON
      - name: Exercise the separate A96 and A512 runtime profiler
        run: |
          export PYTHONPATH="$PWD/src"
          .vision-runtime/bin/python scripts/profile_training_runtime.py --device cpu --warmup-updates 1 --measured-updates 1 --profile-updates 1 --batch-size 1 --threads 1 --out validation/runtime-profile-development
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vision-learning-pytorch-2.9-cpu
          path: |
            validation/vision-development/**/*.json
            validation/runtime-profile-development/**/*.json
          if-no-files-found: warn
          retention-days: 14
  ncc-development:
    name: NCC A512 / Python 3.12.3 PyTorch 2.9 CPU compatibility
    if: github.head_ref == 'research/ncc-mig-pilot' || github.ref == 'refs/heads/research/ncc-mig-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: '0.13.5', enable-cache: true}
      - name: Install matching Python and PyTorch CPU versions
        run: |
          uv python install 3.12.3
          uv venv --python 3.12.3 .ncc-compatibility
          uv pip install --python .ncc-compatibility/bin/python --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.0+cpu'
          uv pip install --python .ncc-compatibility/bin/python numpy==2.3.4
      - name: Test allocation, environment, submission and failure handling
        run: |
          export PYTHONPATH="$PWD/src"
          .ncc-compatibility/bin/python -m unittest discover -s tests -p 'test_ncc*.py' -v
      - name: Train both real A512 development variants on CPU
        run: |
          export PYTHONPATH="$PWD/src:$PWD/scripts"
          .ncc-compatibility/bin/python - <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          import numpy
          import torch
          from ncc_mig_pilot import MODEL, SCENE, WEIGHTS, train_arguments, validate_cell
          from isac_wm.simulator import SceneConfig
          from isac_wm.structured import StructuredConfig
          from isac_wm.training import train
          assert sys.version_info[:3] == (3, 12, 3)
          assert numpy.__version__ == '2.3.4' and torch.__version__ == '2.9.0+cpu'
          torch.set_num_threads(2)
          for weight in WEIGHTS:
              path = Path('validation/ncc-compatibility') / f'vision-{int(weight)}'
              manifest = train(path, device_name='cpu', scene=SceneConfig(**SCENE),
                               model_config=StructuredConfig(**MODEL), **train_arguments(weight))
              summary = validate_cell(path, manifest, weight, expected_device='cpu')
              print('NCC_CPU_COMPATIBILITY', json.dumps(summary))
          print('CPU compatibility only; actual MIG identity and CUDA execution are NCC checks.')
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ncc-a512-cpu-compatibility
          path: validation/ncc-compatibility/**/*.json
          if-no-files-found: warn
          retention-days: 14
  recovery-development:
    name: Recovery training development / CPU
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/paired-recovery-h200'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: '0.13.5', enable-cache: true}
      - name: Load locked CPU runtime
        run: uv sync --locked --extra dev --python 3.14.9
      - name: Train four matched development models
        run: STUDY_PYTHON=.venv/bin/python bash scripts/recovery_cpu_development.sh validation/scale-development
      - name: Score paired recovery on disjoint development episodes
        run: |
          export PYTHONPATH="$PWD/src"
          base=validation/scale-development
          for h in 96 192; do
            .venv/bin/python scripts/score_scale_recovery.py \
              --structured "$base/structured-$h/model.pt" --attention "$base/structured-attention-$h/model.pt" \
              --device cpu --episodes 2 --seed-base 83001200 --steps 64 --out "$base/recovery-$h.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recovery-scale-development
          path: validation/scale-development
          if-no-files-found: error
          retention-days: 14
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, macos-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.14.9'}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Required native CI
        run: python scripts/ci.py --profile native --out validation/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: validation/native
          if-no-files-found: error
          retention-days: 14
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: '0.13.5', enable-cache: true}
      - name: Install exact dependencies
        run: uv sync --locked --extra dev --python 3.14.9
      - name: Required static checks
        run: .venv/bin/python scripts/ci.py --profile quality --out validation/quality
      - name: Show actionable diagnostics if static checks fail
        if: failure()
        run: |
          if test -f validation/quality/ruff.log; then cat validation/quality/ruff.log; fi
          .venv/bin/python -m ruff check --diff src tests scripts || true
          .venv/bin/python -m ruff format --diff src tests scripts || true
      - name: Required advisory audit
        run: .venv/bin/python scripts/ci.py --profile security --out validation/security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-and-security
          path: validation/
          if-no-files-found: error
          retention-days: 14
  reproducibility:
    name: Reproducibility / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: '0.13.5', enable-cache: false}
      - name: Install locked runtime
        run: uv sync --locked --extra dev --python 3.14.9
      - name: Cold online and offline isolated installations
        run: .venv/bin/python scripts/ci.py --profile reproducibility --out validation/reproducibility
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reproducibility
          path: validation/reproducibility
          if-no-files-found: error
          retention-days: 14
  viewer:
    name: Browser replay / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: {version: '0.13.5', enable-cache: true}
      - name: Install locked browser tooling
        run: |
          uv sync --locked --extra dev --extra browser --python 3.14.9
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Exercise clean-clone demo and real browser playback
        run: .venv/bin/python scripts/browser_smoke.py --out validation/browser/report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-replay
          path: validation/browser
          if-no-files-found: error
          retention-days: 14
  ci-gate:
    if: always()
    needs: [python, native, quality, reproducibility, viewer, vision-development, ncc-development]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs must pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          REPRODUCIBILITY_RESULT: ${{ needs.reproducibility.result }}
          VIEWER_RESULT: ${{ needs.viewer.result }}
          VISION_RESULT: ${{ needs.vision-development.result }}
          VISION_REQUIRED: ${{ github.head_ref == 'research/vision-supervision-h200' || github.ref == 'refs/heads/research/vision-supervision-h200' }}
          NCC_RESULT: ${{ needs.ncc-development.result }}
          NCC_REQUIRED: ${{ github.head_ref == 'research/ncc-mig-pilot' || github.ref == 'refs/heads/research/ncc-mig-pilot' }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$REPRODUCIBILITY_RESULT" = success
          test "$VIEWER_RESULT" = success
          if test "$VISION_REQUIRED" = true; then
            test "$VISION_RESULT" = success
          else
            test "$VISION_RESULT" = skipped
          fi
          if test "$NCC_REQUIRED" = true; then
            test "$NCC_RESULT" = success
          else
            test "$NCC_RESULT" = skipped
          fi

