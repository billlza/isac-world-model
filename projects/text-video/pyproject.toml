[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-video-flow"
version = "0.1.0"
description = "Independent, randomly initialized text-conditioned video flow model"
requires-python = ">=3.10"
dependencies = ["torch>=2.9,<3", "numpy>=2,<3", "Pillow>=10", "imageio>=2.37", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
text-video = "text_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
